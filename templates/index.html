<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generator kodów</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 800px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 35px;
        }

        .grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 25px 30px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;

            margin-bottom: 8px;
        }

        select,
        input {

            width: 100%;

            height: 40px;

            padding: 5px 10px;

            font-size: 15px;

            border: 1px solid #aaa;

            border-radius: 5px;

            background: white;
        }

        select:focus,
        input:focus {

            outline: none;

            border-color: #555;
        }

        .number {
            margin-top: 25px;
        }

        .button-container {
            text-align: center;
        }

        button {

            margin-top: 30px;

            padding: 12px 30px;

            font-size: 16px;

            font-weight: bold;

            border: none;

            border-radius: 6px;

            background: #333;

            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .result {

            margin-top: 25px;

            text-align: center;
        }

        .code {

            margin-top: 10px;

            padding: 15px;

            font-size: 28px;

            font-weight: bold;

            background: #fafafa;

            border: 2px solid #ddd;

            border-radius: 6px;

            word-break: break-all;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .container {

                width: 100%;

                padding: 25px 20px;
            }

            .grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>Generator kodów</h1>


    <form method="POST" id="generatorForm">


        <div class="grid">


            <!-- ========================= -->
            <!-- GRUPA -->
            <!-- ========================= -->

            <div class="field">

                <label for="grupa">
                    Grupa
                </label>

                <select name="grupa" id="grupa">

                    <option value="">
                        Nie wybrano
                    </option>

                    <option value="Materiały eksploatacyjne">
                        Materiały eksploatacyjne
                    </option>

                </select>

            </div>


            <!-- ========================= -->
            <!-- PRODUCENT -->
            <!-- ========================= -->

            <div class="field">

                <label for="producent">
                    Producent
                </label>

                <select name="producent" id="producent">

                    <option value="">
                        Nie wybrano
                    </option>

                    <option value="Hewlett Packard">
                        Hewlett Packard
                    </option>

                    <option value="Brother">
                        Brother
                    </option>

                    <option value="Canon">
                        Canon
                    </option>

                    <option value="Epson">
                        Epson
                    </option>

                </select>

            </div>


            <!-- ========================= -->
            <!-- KOMPATYBILNOŚĆ -->
            <!-- ========================= -->

            <div class="field">

                <label for="kompatybilnosc">
                    Kompatybilność
                </label>

                <select name="kompatybilnosc" id="kompatybilnosc">

                    <option value="">
                        Nie wybrano
                    </option>

                    <option value="Hewlett Packard">
                        Hewlett Packard
                    </option>

                    <option value="Brother">
                        Brother
                    </option>

                    <option value="Canon">
                        Canon
                    </option>

                    <option value="Epson">
                        Epson
                    </option>

                </select>

            </div>


            <!-- ========================= -->
            <!-- RODZAJ -->
            <!-- ========================= -->

            <div class="field">

                <label for="rodzaj">
                    Rodzaj
                </label>

                <select name="rodzaj" id="rodzaj">

                    <option value="">
                        Nie wybrano
                    </option>

                    <option value="Tusz">
                        Tusz
                    </option>

                    <option value="Toner">
                        Toner
                    </option>

                    <option value="Bębeb">
                        Bębeb
                    </option>

                </select>

            </div>


            <!-- ========================= -->
            <!-- KOLOR -->
            <!-- ========================= -->

            <div class="field">

                <label for="kolor">
                    Kolor
                </label>

                <select name="kolor" id="kolor">

                    <option value="">
                        Nie wybrano
                    </option>

                    <option value="Czarny">
                        Czarny
                    </option>

                    <option value="Niebieski">
                        Niebieski
                    </option>

                    <option value="Różowy">
                        Różowy
                    </option>

                    <option value="Żółty">
                        Żółty
                    </option>

                    <option value="Kolorowy">
                        Kolorowy
                    </option>

                    <option value="Zestaw">
                        Zestaw
                    </option>

                </select>

            </div>


            <!-- ========================= -->
            <!-- POCHODZENIE -->
            <!-- ========================= -->

            <div class="field">

                <label for="pochodzenie">
                    Pochodzenie
                </label>

                <select name="pochodzenie" id="pochodzenie">

                    <option value="">
                        Nie wybrano
                    </option>

                    <option value="Dystrybucja">
                        Dystrybucja
                    </option>

                    <option value="Rynek">
                        Rynek
                    </option>

                </select>

            </div>


        </div>


        <!-- ========================= -->
        <!-- NUMER INDEKSOWY -->
        <!-- ========================= -->

        <div class="field number">

            <label for="numer">
                Numer indeksowy
            </label>

            <input
                type="text"
                name="numer"
                id="numer"
                value="{{ dane.numer }}"
            >

        </div>


        <!-- ========================= -->
        <!-- PRZYCISK -->
        <!-- ========================= -->

        <div class="button-container">

            <button type="submit">
                Wygeneruj kod
            </button>

        </div>


    </form>


    <!-- ========================= -->
    <!-- WYNIK -->
    <!-- ========================= -->

    <div class="result">

        <div>
            Wygenerowany kod:
        </div>

        <div class="code" id="kod">
            {{ kod }}
        </div>

    </div>


</div>



<script>


    /*
    ============================================================
    LOCAL STORAGE
    ============================================================

    Tutaj przechowujemy ustawienia użytkownika.
    */


    const STORAGE_KEY = "generatorKodowDane";


    /*
    Pobieramy elementy strony.
    */

    const grupa =
        document.getElementById("grupa");

    const producent =
        document.getElementById("producent");

    const kompatybilnosc =
        document.getElementById("kompatybilnosc");

    const rodzaj =
        document.getElementById("rodzaj");

    const kolor =
        document.getElementById("kolor");

    const pochodzenie =
        document.getElementById("pochodzenie");

    const numer =
        document.getElementById("numer");

    const kod =
        document.getElementById("kod");

    const formularz =
        document.getElementById("generatorForm");


    /*
    ============================================================
    ZAPIS DANYCH
    ============================================================
    */

    function zapiszDane() {

        const dane = {

            grupa: grupa.value,

            producent: producent.value,

            kompatybilnosc: kompatybilnosc.value,

            rodzaj: rodzaj.value,

            kolor: kolor.value,

            pochodzenie: pochodzenie.value,

            numer: numer.value,

            kod: kod.innerText

        };


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(dane)
        );

    }


    /*
    ============================================================
    USUWANIE "NIE WYBRANO"
    ============================================================

    Działa tak samo jak w Twoim Tkinterze.

    Po wybraniu pierwszej prawdziwej opcji
    "Nie wybrano" zostaje usunięte z tego pola.
    */

    function usunNieWybrano(select) {

        if (select.value !== "") {

            const opcja =
                select.querySelector(
                    'option[value=""]'
                );

            if (opcja) {

                opcja.remove();

            }

        }

    }


    /*
    ============================================================
    FUNKCJA OBSŁUGUJĄCA ZMIANĘ POLA
    ============================================================
    */

    function zmianaPola(select) {

        usunNieWybrano(select);

        zapiszDane();

    }


    /*
    Podpinamy funkcję do wszystkich pól.
    */

    grupa.addEventListener(
        "change",
        function() {

            zmianaPola(grupa);

        }
    );


    producent.addEventListener(
        "change",
        function() {

            zmianaPola(producent);

        }
    );


    kompatybilnosc.addEventListener(
        "change",
        function() {

            zmianaPola(kompatybilnosc);

        }
    );


    rodzaj.addEventListener(
        "change",
        function() {

            zmianaPola(rodzaj);

        }
    );


    kolor.addEventListener(
        "change",
        function() {

            zmianaPola(kolor);

        }
    );


    pochodzenie.addEventListener(
        "change",
        function() {

            zmianaPola(pochodzenie);

        }
    );


    /*
    Numer zapisujemy od razu podczas pisania.
    */

    numer.addEventListener(
        "input",
        function() {

            zapiszDane();

        }
    );


    /*
    ============================================================
    WCZYTYWANIE DANYCH
    ============================================================
    */

    function wczytajDane() {

        const zapisane =
            localStorage.getItem(STORAGE_KEY);


        if (!zapisane) {

            return;

        }


        try {

            const dane =
                JSON.parse(zapisane);


            /*
            Przywracamy wartości.
            */

            if (dane.grupa !== undefined) {

                grupa.value = dane.grupa;

            }


            if (dane.producent !== undefined) {

                producent.value = dane.producent;

            }


            if (dane.kompatybilnosc !== undefined) {

                kompatybilnosc.value =
                    dane.kompatybilnosc;

            }


            if (dane.rodzaj !== undefined) {

                rodzaj.value = dane.rodzaj;

            }


            if (dane.kolor !== undefined) {

                kolor.value = dane.kolor;

            }


            if (dane.pochodzenie !== undefined) {

                pochodzenie.value =
                    dane.pochodzenie;

            }


            if (dane.numer !== undefined) {

                numer.value = dane.numer;

            }


            /*
            ====================================================
            WAŻNE
            ====================================================

            Jeżeli pole miało już wybraną wartość,
            usuwamy "Nie wybrano".

            Dzięki temu po ponownym wejściu zachowuje
            się tak samo jak wcześniej.
            */

            usunNieWybrano(grupa);

            usunNieWybrano(producent);

            usunNieWybrano(kompatybilnosc);

            usunNieWybrano(rodzaj);

            usunNieWybrano(kolor);

            usunNieWybrano(pochodzenie);


        }
        catch (error) {

            console.log(
                "Błąd podczas wczytywania danych:",
                error
            );

        }

    }


    /*
    ============================================================
    WYSŁANIE FORMULARZA
    ============================================================
    */

    formularz.addEventListener(
        "submit",
        function() {

            /*
            Najpierw zapisujemy obecne dane.
            */

            zapiszDane();

        }
    );


    /*
    ============================================================
    START
    ============================================================
    */

    wczytajDane();


</script>


</body>

</html>
