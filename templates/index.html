<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generator kodów</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            background: white;

            padding: 45px 55px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;

            margin: 0 0 40px 0;

            font-size: 30px;
        }

        .grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 30px 40px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;

            margin-bottom: 8px;

            font-size: 15px;
        }

        select,
        input {
            width: 100%;

            height: 42px;

            padding: 5px 10px;

            font-size: 15px;

            border: 1px solid #aaa;

            border-radius: 5px;

            background: white;
        }

        select:focus,
        input:focus {
            outline: none;

            border-color: #555;
        }

        .number {
            width: 300px;

            margin: 35px auto 0;
        }

        .button-container {
            text-align: center;
        }

        .generate-button {
            margin-top: 30px;

            padding: 13px 32px;

            font-size: 16px;

            font-weight: bold;

            border: none;

            border-radius: 6px;

            background: #333;

            color: white;

            cursor: pointer;
        }

        .generate-button:hover {
            background: #555;
        }

        .result {
            margin-top: 35px;

            text-align: center;
        }

        .result-title {
            font-size: 16px;

            margin-bottom: 10px;
        }

        .code {
            padding: 15px;

            font-size: 28px;

            font-weight: bold;

            background: #fafafa;

            border: 2px solid #ddd;

            border-radius: 6px;

            word-break: break-all;

            min-height: 62px;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .copy-button {
            margin-top: 15px;

            padding: 11px 25px;

            font-size: 15px;

            font-weight: bold;

            border: none;

            border-radius: 6px;

            background: #555;

            color: white;

            cursor: pointer;
        }

        .copy-button:hover {
            background: #333;
        }

        @media (max-width: 750px) {

            body {
                padding: 15px;

                align-items: flex-start;
            }

            .container {
                padding: 30px 20px;

                margin-top: 15px;
            }

            .grid {
                grid-template-columns: 1fr;

                gap: 20px;
            }

            .number {
                width: 100%;
            }

            h1 {
                font-size: 25px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <h1>Generator kodów</h1>


    <div class="grid">


        <!-- GRUPA -->

        <div class="field">

            <label for="grupa">
                Grupa
            </label>

            <select id="grupa">

                <option value="">
                    Nie wybrano
                </option>

                <option value="Materiały eksploatacyjne">
                    Materiały eksploatacyjne
                </option>

            </select>

        </div>


        <!-- PRODUCENT -->

        <div class="field">

            <label for="producent">
                Producent
            </label>

            <select id="producent">

                <option value="">
                    Nie wybrano
                </option>

                <option value="Hewlett Packard">
                    Hewlett Packard
                </option>

                <option value="Brother">
                    Brother
                </option>

                <option value="Canon">
                    Canon
                </option>

                <option value="Epson">
                    Epson
                </option>

            </select>

        </div>


        <!-- KOMPATYBILNOŚĆ -->

        <div class="field">

            <label for="kompatybilnosc">
                Kompatybilność
            </label>

            <select id="kompatybilnosc">

                <option value="">
                    Nie wybrano
                </option>

                <option value="Hewlett Packard">
                    Hewlett Packard
                </option>

                <option value="Brother">
                    Brother
                </option>

                <option value="Canon">
                    Canon
                </option>

                <option value="Epson">
                    Epson
                </option>

            </select>

        </div>


        <!-- RODZAJ -->

        <div class="field">

            <label for="rodzaj">
                Rodzaj
            </label>

            <select id="rodzaj">

                <option value="">
                    Nie wybrano
                </option>

                <option value="Tusz">
                    Tusz
                </option>

                <option value="Toner">
                    Toner
                </option>

                <option value="Bębeb">
                    Bębeb
                </option>

            </select>

        </div>


        <!-- KOLOR -->

        <div class="field">

            <label for="kolor">
                Kolor
            </label>

            <select id="kolor">

                <option value="">
                    Nie wybrano
                </option>

                <option value="Czarny">
                    Czarny
                </option>

                <option value="Niebieski">
                    Niebieski
                </option>

                <option value="Różowy">
                    Różowy
                </option>

                <option value="Żółty">
                    Żółty
                </option>

                <option value="Kolorowy">
                    Kolorowy
                </option>

                <option value="Zestaw">
                    Zestaw
                </option>

            </select>

        </div>


        <!-- POCHODZENIE -->

        <div class="field">

            <label for="pochodzenie">
                Pochodzenie
            </label>

            <select id="pochodzenie">

                <option value="">
                    Nie wybrano
                </option>

                <option value="Dystrybucja">
                    Dystrybucja
                </option>

                <option value="Rynek">
                    Rynek
                </option>

            </select>

        </div>


    </div>


    <!-- NUMER -->

    <div class="field number">

        <label for="numer">
            Numer indeksowy
        </label>

        <input
            type="number"
            id="numer"
            min="1"
            value="1"
        >

    </div>


    <!-- PRZYCISK -->

    <div class="button-container">

        <button
            class="generate-button"
            id="generateButton"
            type="button"
        >
            Wygeneruj kod
        </button>

    </div>


    <!-- WYNIK -->

    <div class="result">

        <div class="result-title">
            Wygenerowany kod:
        </div>

        <div
            class="code"
            id="kod"
        >
            Tu pojawi się kod
        </div>

        <button
            class="copy-button"
            id="copyButton"
            type="button"
        >
            Kopiuj kod
        </button>

    </div>


</div>


<script>


    /* =====================================================
       ELEMENTY
    ===================================================== */

    const grupa =
        document.getElementById("grupa");

    const producent =
        document.getElementById("producent");

    const kompatybilnosc =
        document.getElementById("kompatybilnosc");

    const rodzaj =
        document.getElementById("rodzaj");

    const kolor =
        document.getElementById("kolor");

    const pochodzenie =
        document.getElementById("pochodzenie");

    const numer =
        document.getElementById("numer");

    const kod =
        document.getElementById("kod");

    const generateButton =
        document.getElementById("generateButton");

    const copyButton =
        document.getElementById("copyButton");


    /* =====================================================
       KLUCZ LOCAL STORAGE
    ===================================================== */

    const STORAGE_KEY =
        "generator_kodow_dane";


    /* =====================================================
       ZAPISYWANIE
    ===================================================== */

    function zapiszDane() {

        const dane = {

            grupa: grupa.value,

            producent: producent.value,

            kompatybilnosc:
                kompatybilnosc.value,

            rodzaj: rodzaj.value,

            kolor: kolor.value,

            pochodzenie:
                pochodzenie.value,

            numer: numer.value,

            kod: kod.textContent

        };


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(dane)
        );

    }


    /* =====================================================
       WCZYTYWANIE
    ===================================================== */

    function wczytajDane() {

        const zapisane =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!zapisane) {

            return;

        }


        try {

            const dane =
                JSON.parse(zapisane);


            if (dane.grupa !== undefined) {
                grupa.value = dane.grupa;
            }


            if (dane.producent !== undefined) {
                producent.value = dane.producent;
            }


            if (dane.kompatybilnosc !== undefined) {
                kompatybilnosc.value =
                    dane.kompatybilnosc;
            }


            if (dane.rodzaj !== undefined) {
                rodzaj.value = dane.rodzaj;
            }


            if (dane.kolor !== undefined) {
                kolor.value = dane.kolor;
            }


            if (dane.pochodzenie !== undefined) {
                pochodzenie.value =
                    dane.pochodzenie;
            }


            if (
                dane.numer !== undefined &&
                dane.numer !== ""
            ) {

                numer.value =
                    dane.numer;

            }


            if (
                dane.kod !== undefined &&
                dane.kod !== ""
            ) {

                kod.textContent =
                    dane.kod;

            }


            usunNieWybrano(grupa);
            usunNieWybrano(producent);
            usunNieWybrano(kompatybilnosc);
            usunNieWybrano(rodzaj);
            usunNieWybrano(kolor);
            usunNieWybrano(pochodzenie);


        } catch (error) {

            console.error(
                "Błąd odczytu danych:",
                error
            );

        }

    }


    /* =====================================================
       USUWANIE "NIE WYBRANO"
    ===================================================== */

    function usunNieWybrano(select) {

        if (select.value !== "") {

            const opcja =
                select.querySelector(
                    'option[value=""]'
                );


            if (opcja) {

                opcja.remove();

            }

        }

    }


    /* =====================================================
       GENEROWANIE KODU
    ===================================================== */

    function generujKod() {

        let kodzik = "";


        /* GRUPA */

        if (
            grupa.value ===
            "Materiały eksploatacyjne"
        ) {

            kodzik += "ME";

        }


        /* PRODUCENT */

        if (
            producent.value ===
            "Hewlett Packard"
        ) {

            kodzik += "HP";

        }

        else if (
            producent.value ===
            "Brother"
        ) {

            kodzik += "BR";

        }

        else if (
            producent.value ===
            "Canon"
        ) {

            kodzik += "CA";

        }

        else if (
            producent.value ===
            "Epson"
        ) {

            kodzik += "EP";

        }


        /* KOMPATYBILNOŚĆ */

        if (
            kompatybilnosc.value ===
            "Hewlett Packard"
        ) {

            kodzik += "HP";

        }

        else if (
            kompatybilnosc.value ===
            "Brother"
        ) {

            kodzik += "BR";

        }

        else if (
            kompatybilnosc.value ===
            "Canon"
        ) {

            kodzik += "CA";

        }

        else if (
            kompatybilnosc.value ===
            "Epson"
        ) {

            kodzik += "EP";

        }


        /* RODZAJ */

        if (
            rodzaj.value ===
            "Tusz"
        ) {

            kodzik += "INK";

        }

        else if (
            rodzaj.value ===
            "Toner"
        ) {

            kodzik += "TON";

        }

        else if (
            rodzaj.value ===
            "Bębeb"
        ) {

            kodzik += "BB";

        }


        /* KOLOR */

        if (
            kolor.value ===
            "Czarny"
        ) {

            kodzik += "BK";

        }

        else if (
            kolor.value ===
            "Niebieski"
        ) {

            kodzik += "C";

        }

        else if (
            kolor.value ===
            "Różowy"
        ) {

            kodzik += "M";

        }

        else if (
            kolor.value ===
            "Żółty"
        ) {

            kodzik += "Y";

        }

        else if (
            kolor.value ===
            "Kolorowy"
        ) {

            kodzik += "CMY";

        }

        else if (
            kolor.value ===
            "Zestaw"
        ) {

            kodzik += "CMYK";

        }


        /* POCHODZENIE */

        if (
            pochodzenie.value ===
            "Dystrybucja"
        ) {

            kodzik += "D";

        }

        else if (
            pochodzenie.value ===
            "Rynek"
        ) {

            kodzik += "R";

        }


        /* NUMER */

        const numerTekst =
            numer.value.trim();


        if (
            numerTekst === "" ||
            !/^\d+$/.test(numerTekst) ||
            parseInt(numerTekst) < 1
        ) {

            kod.textContent =
                "Wpisz poprawny numer!";

            zapiszDane();

            return;

        }


        const obecnyNumer =
            parseInt(numerTekst);


        /* Dodajemy numer do kodu */

        kodzik +=
            String(obecnyNumer);


        /* Pokazujemy kod */

        kod.textContent =
            kodzik;


        /* Zwiększamy numer */

        numer.value =
            String(obecnyNumer + 1);


        /* Zapamiętujemy WSZYSTKO */

        zapiszDane();

    }


    /* =====================================================
       PRZYCISK GENEROWANIA
    ===================================================== */

    generateButton.addEventListener(
        "click",
        generujKod
    );


    /* =====================================================
       ZAPISYWANIE ZMIAN
    ===================================================== */

    grupa.addEventListener(
        "change",
        function() {

            usunNieWybrano(grupa);

            zapiszDane();

        }
    );


    producent.addEventListener(
        "change",
        function() {

            usunNieWybrano(producent);

            zapiszDane();

        }
    );


    kompatybilnosc.addEventListener(
        "change",
        function() {

            usunNieWybrano(kompatybilnosc);

            zapiszDane();

        }
    );


    rodzaj.addEventListener(
        "change",
        function() {

            usunNieWybrano(rodzaj);

            zapiszDane();

        }
    );


    kolor.addEventListener(
        "change",
        function() {

            usunNieWybrano(kolor);

            zapiszDane();

        }
    );


    pochodzenie.addEventListener(
        "change",
        function() {

            usunNieWybrano(pochodzenie);

            zapiszDane();

        }
    );


    numer.addEventListener(
        "input",
        function() {

            zapiszDane();

        }
    );


    /* =====================================================
       KOPIOWANIE
    ===================================================== */

    copyButton.addEventListener(
        "click",
        async function() {

            const tekst =
                kod.textContent.trim();


            if (
                tekst === "" ||
                tekst ===
                "Tu pojawi się kod" ||
                tekst ===
                "Wpisz poprawny numer!"
            ) {

                return;

            }


            try {

                await navigator.clipboard.writeText(
                    tekst
                );


                copyButton.textContent =
                    "Skopiowano!";


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "Kopiuj kod";

                    },
                    1500
                );


            } catch (error) {

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.value =
                    tekst;


                document.body.appendChild(
                    textarea
                );


                textarea.select();


                document.execCommand(
                    "copy"
                );


                document.body.removeChild(
                    textarea
                );


                copyButton.textContent =
                    "Skopiowano!";


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "Kopiuj kod";

                    },
                    1500
                );

            }

        }
    );


    /* =====================================================
       START
    ===================================================== */

    wczytajDane();


</script>


</body>

</html>
