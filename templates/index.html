<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Generator kodów</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        .container {

            width: 100%;

            max-width: 1000px;

            background: white;

            padding: 45px 55px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.12);
        }


        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 40px;

            font-size: 30px;
        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 30px 40px;
        }


        .field {

            display: flex;

            flex-direction: column;
        }


        label {

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 15px;
        }


        select,
        input {

            width: 100%;

            height: 42px;

            padding: 5px 10px;

            font-size: 15px;

            border:
                1px solid #aaa;

            border-radius: 5px;

            background: white;
        }


        select:focus,
        input:focus {

            outline: none;

            border-color: #555;
        }


        .number {

            width: 300px;

            margin:
                35px auto 0;
        }


        .button-container {

            text-align: center;
        }


        .generate-button {

            margin-top: 30px;

            padding:
                13px 32px;

            font-size: 16px;

            font-weight: bold;

            border: none;

            border-radius: 6px;

            background: #333;

            color: white;

            cursor: pointer;
        }


        .generate-button:hover {

            background: #555;
        }


        .result {

            margin-top: 35px;

            text-align: center;
        }


        .result-title {

            font-size: 16px;

            margin-bottom: 10px;
        }


        .code {

            padding: 15px;

            font-size: 28px;

            font-weight: bold;

            background: #fafafa;

            border:
                2px solid #ddd;

            border-radius: 6px;

            word-break: break-all;

            min-height: 62px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .copy-button {

            margin-top: 15px;

            padding:
                11px 25px;

            font-size: 15px;

            font-weight: bold;

            border: none;

            border-radius: 6px;

            background: #555;

            color: white;

            cursor: pointer;
        }


        .copy-button:hover {

            background: #333;
        }


        /*
        ============================================
        TELEFON
        ============================================
        */

        @media (max-width: 750px) {

            body {

                padding: 15px;

                align-items:
                    flex-start;
            }


            .container {

                padding:
                    30px 20px;

                margin-top: 15px;
            }


            .grid {

                grid-template-columns:
                    1fr;

                gap: 20px;
            }


            .number {

                width: 100%;
            }


            h1 {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Generator kodów
    </h1>


    <form
        method="POST"
        id="generatorForm"
    >


        <div class="grid">


            <!-- GRUPA -->

            <div class="field">

                <label for="grupa">
                    Grupa
                </label>

                <select
                    name="grupa"
                    id="grupa"
                >

                    <option value="">
                        Nie wybrano
                    </option>

                    <option
                        value="Materiały eksploatacyjne"
                        {% if dane.grupa == "Materiały eksploatacyjne" %}
                        selected
                        {% endif %}
                    >
                        Materiały eksploatacyjne
                    </option>

                </select>

            </div>


            <!-- PRODUCENT -->

            <div class="field">

                <label for="producent">
                    Producent
                </label>

                <select
                    name="producent"
                    id="producent"
                >

                    <option value="">
                        Nie wybrano
                    </option>

                    <option
                        value="Hewlett Packard"
                        {% if dane.producent == "Hewlett Packard" %}
                        selected
                        {% endif %}
                    >
                        Hewlett Packard
                    </option>

                    <option
                        value="Brother"
                        {% if dane.producent == "Brother" %}
                        selected
                        {% endif %}
                    >
                        Brother
                    </option>

                    <option
                        value="Canon"
                        {% if dane.producent == "Canon" %}
                        selected
                        {% endif %}
                    >
                        Canon
                    </option>

                    <option
                        value="Epson"
                        {% if dane.producent == "Epson" %}
                        selected
                        {% endif %}
                    >
                        Epson
                    </option>

                </select>

            </div>


            <!-- KOMPATYBILNOŚĆ -->

            <div class="field">

                <label for="kompatybilnosc">
                    Kompatybilność
                </label>

                <select
                    name="kompatybilnosc"
                    id="kompatybilnosc"
                >

                    <option value="">
                        Nie wybrano
                    </option>

                    <option
                        value="Hewlett Packard"
                        {% if dane.kompatybilnosc == "Hewlett Packard" %}
                        selected
                        {% endif %}
                    >
                        Hewlett Packard
                    </option>

                    <option
                        value="Brother"
                        {% if dane.kompatybilnosc == "Brother" %}
                        selected
                        {% endif %}
                    >
                        Brother
                    </option>

                    <option
                        value="Canon"
                        {% if dane.kompatybilnosc == "Canon" %}
                        selected
                        {% endif %}
                    >
                        Canon
                    </option>

                    <option
                        value="Epson"
                        {% if dane.kompatybilnosc == "Epson" %}
                        selected
                        {% endif %}
                    >
                        Epson
                    </option>

                </select>

            </div>


            <!-- RODZAJ -->

            <div class="field">

                <label for="rodzaj">
                    Rodzaj
                </label>

                <select
                    name="rodzaj"
                    id="rodzaj"
                >

                    <option value="">
                        Nie wybrano
                    </option>

                    <option
                        value="Tusz"
                        {% if dane.rodzaj == "Tusz" %}
                        selected
                        {% endif %}
                    >
                        Tusz
                    </option>

                    <option
                        value="Toner"
                        {% if dane.rodzaj == "Toner" %}
                        selected
                        {% endif %}
                    >
                        Toner
                    </option>

                    <option
                        value="Bębeb"
                        {% if dane.rodzaj == "Bębeb" %}
                        selected
                        {% endif %}
                    >
                        Bębeb
                    </option>

                </select>

            </div>


            <!-- KOLOR -->

            <div class="field">

                <label for="kolor">
                    Kolor
                </label>

                <select
                    name="kolor"
                    id="kolor"
                >

                    <option value="">
                        Nie wybrano
                    </option>

                    <option
                        value="Czarny"
                        {% if dane.kolor == "Czarny" %}
                        selected
                        {% endif %}
                    >
                        Czarny
                    </option>

                    <option
                        value="Niebieski"
                        {% if dane.kolor == "Niebieski" %}
                        selected
                        {% endif %}
                    >
                        Niebieski
                    </option>

                    <option
                        value="Różowy"
                        {% if dane.kolor == "Różowy" %}
                        selected
                        {% endif %}
                    >
                        Różowy
                    </option>

                    <option
                        value="Żółty"
                        {% if dane.kolor == "Żółty" %}
                        selected
                        {% endif %}
                    >
                        Żółty
                    </option>

                    <option
                        value="Kolorowy"
                        {% if dane.kolor == "Kolorowy" %}
                        selected
                        {% endif %}
                    >
                        Kolorowy
                    </option>

                    <option
                        value="Zestaw"
                        {% if dane.kolor == "Zestaw" %}
                        selected
                        {% endif %}
                    >
                        Zestaw
                    </option>

                </select>

            </div>


            <!-- POCHODZENIE -->

            <div class="field">

                <label for="pochodzenie">
                    Pochodzenie
                </label>

                <select
                    name="pochodzenie"
                    id="pochodzenie"
                >

                    <option value="">
                        Nie wybrano
                    </option>

                    <option
                        value="Dystrybucja"
                        {% if dane.pochodzenie == "Dystrybucja" %}
                        selected
                        {% endif %}
                    >
                        Dystrybucja
                    </option>

                    <option
                        value="Rynek"
                        {% if dane.pochodzenie == "Rynek" %}
                        selected
                        {% endif %}
                    >
                        Rynek
                    </option>

                </select>

            </div>


        </div>


        <!-- NUMER INDEKSOWY -->

        <div class="field number">

            <label for="numer">
                Numer indeksowy
            </label>

            <input
                type="text"
                name="numer"
                id="numer"
                value="{{ dane.numer }}"
            >

        </div>


        <!-- PRZYCISK GENEROWANIA -->

        <div class="button-container">

            <button
                type="submit"
                class="generate-button"
            >
                Wygeneruj kod
            </button>

        </div>


    </form>


    <!-- WYNIK -->

    <div class="result">

        <div class="result-title">
            Wygenerowany kod:
        </div>


        <div
            class="code"
            id="kod"
        >
            {{ kod }}
        </div>


        <!-- KOPIOWANIE -->

        <button
            type="button"
            class="copy-button"
            id="copyButton"
        >
            Kopiuj kod
        </button>

    </div>


</div>



<script>


    /*
    ============================================================
    LOCAL STORAGE
    ============================================================
    */

    const STORAGE_KEY =
        "generatorKodowDane";


    /*
    ============================================================
    ELEMENTY
    ============================================================
    */

    const grupa =
        document.getElementById("grupa");

    const producent =
        document.getElementById("producent");

    const kompatybilnosc =
        document.getElementById(
            "kompatybilnosc"
        );

    const rodzaj =
        document.getElementById("rodzaj");

    const kolor =
        document.getElementById("kolor");

    const pochodzenie =
        document.getElementById(
            "pochodzenie"
        );

    const numer =
        document.getElementById("numer");

    const kod =
        document.getElementById("kod");

    const formularz =
        document.getElementById(
            "generatorForm"
        );

    const copyButton =
        document.getElementById(
            "copyButton"
        );


    /*
    ============================================================
    ZAPIS DANYCH
    ============================================================
    */

    function zapiszDane() {

        const dane = {

            grupa:
                grupa.value,

            producent:
                producent.value,

            kompatybilnosc:
                kompatybilnosc.value,

            rodzaj:
                rodzaj.value,

            kolor:
                kolor.value,

            pochodzenie:
                pochodzenie.value,

            numer:
                numer.value,

            kod:
                kod.innerText

        };


        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(dane)

        );

    }


    /*
    ============================================================
    USUWANIE "NIE WYBRANO"
    ============================================================
    */

    function usunNieWybrano(select) {

        if (
            select.value !== ""
        ) {

            const opcja =
                select.querySelector(
                    'option[value=""]'
                );


            if (opcja) {

                opcja.remove();

            }

        }

    }


    /*
    ============================================================
    ZMIANA POLA
    ============================================================
    */

    function zmianaPola(select) {

        usunNieWybrano(select);

        zapiszDane();

    }


    grupa.addEventListener(
        "change",
        function() {

            zmianaPola(grupa);

        }
    );


    producent.addEventListener(
        "change",
        function() {

            zmianaPola(producent);

        }
    );


    kompatybilnosc.addEventListener(
        "change",
        function() {

            zmianaPola(
                kompatybilnosc
            );

        }
    );


    rodzaj.addEventListener(
        "change",
        function() {

            zmianaPola(rodzaj);

        }
    );


    kolor.addEventListener(
        "change",
        function() {

            zmianaPola(kolor);

        }
    );


    pochodzenie.addEventListener(
        "change",
        function() {

            zmianaPola(
                pochodzenie
            );

        }
    );


    /*
    ============================================================
    NUMER
    ============================================================
    */

    numer.addEventListener(
        "input",
        function() {

            zapiszDane();

        }
    );


    /*
    ============================================================
    WCZYTYWANIE DANYCH Z PRZEGLĄDARKI
    ============================================================
    */

    function wczytajDane() {

        const zapisane =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!zapisane) {

            return;

        }


        try {

            const dane =
                JSON.parse(zapisane);


            if (
                dane.grupa !==
                undefined
            ) {

                grupa.value =
                    dane.grupa;

            }


            if (
                dane.producent !==
                undefined
            ) {

                producent.value =
                    dane.producent;

            }


            if (
                dane.kompatybilnosc !==
                undefined
            ) {

                kompatybilnosc.value =
                    dane.kompatybilnosc;

            }


            if (
                dane.rodzaj !==
                undefined
            ) {

                rodzaj.value =
                    dane.rodzaj;

            }


            if (
                dane.kolor !==
                undefined
            ) {

                kolor.value =
                    dane.kolor;

            }


            if (
                dane.pochodzenie !==
                undefined
            ) {

                pochodzenie.value =
                    dane.pochodzenie;

            }


            /*
            UWAGA:

            Numer NIE jest tutaj przywracany
            z localStorage.

            Numer pochodzi z serwera,
            dzięki czemu wszyscy użytkownicy
            korzystają z jednego numeru.
            */


            usunNieWybrano(grupa);

            usunNieWybrano(producent);

            usunNieWybrano(
                kompatybilnosc
            );

            usunNieWybrano(rodzaj);

            usunNieWybrano(kolor);

            usunNieWybrano(
                pochodzenie
            );


        }
        catch (error) {

            console.log(
                "Błąd podczas wczytywania danych:",
                error
            );

        }

    }


    /*
    ============================================================
    KOPIOWANIE KODU
    ============================================================
    */

    copyButton.addEventListener(
        "click",
        async function() {

            const tekst =
                kod.innerText.trim();


            if (
                !tekst ||
                tekst ===
                "Tu pojawi się kod"
            ) {

                return;

            }


            try {

                await navigator.clipboard.writeText(
                    tekst
                );


                copyButton.innerText =
                    "Skopiowano!";


                setTimeout(
                    function() {

                        copyButton.innerText =
                            "Kopiuj kod";

                    },
                    1500
                );


            }
            catch (error) {

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.value =
                    tekst;


                document.body.appendChild(
                    textarea
                );


                textarea.select();


                document.execCommand(
                    "copy"
                );


                document.body.removeChild(
                    textarea
                );


                copyButton.innerText =
                    "Skopiowano!";


                setTimeout(
                    function() {

                        copyButton.innerText =
                            "Kopiuj kod";

                    },
                    1500
                );

            }

        }
    );


    /*
    ============================================================
    PRZED WYSŁANIEM
    ============================================================
    */

    formularz.addEventListener(
        "submit",
        function() {

            /*
            Zapisujemy wybory,
            ale NIE zwiększamy tutaj numeru.

            Numer zwiększa Python.
            */

            zapiszDane();

        }
    );


    /*
    ============================================================
    START
    ============================================================
    */

    wczytajDane();


</script>


</body>

</html>
